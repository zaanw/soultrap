name: Build and test Soultrap
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.427'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Validate release-signing script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/scripts/Build-SignedRelease.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; throw 'Signing script syntax error.' }
      - run: dotnet restore Soultrap.sln --locked-mode
      - run: dotnet build Soultrap.sln -c Release --no-restore
      - run: dotnet test Soultrap.Tests -c Release --no-build --logger 'trx;LogFileName=windows.trx'
      - name: Open WPF window and every tab (binding regression check)
        shell: pwsh
        run: |
          foreach ($arguments in @('--smoke-test', '--smoke-test --no-splash', '--smoke-test --classic-splash')) {
            $app = Start-Process -FilePath .\Soultrap.App\bin\Release\net8.0-windows\Soultrap.exe -ArgumentList $arguments -PassThru
            if (!$app.WaitForExit(30000)) { $app.Kill(); throw 'WPF smoke test timed out.' }
            if ($app.ExitCode -ne 0) {
              $report = Join-Path $env:TEMP 'Soultrap-smoke-errors.txt'
              if (Test-Path $report) {
                Get-Content $report
                $detail = (Get-Content $report -Raw).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
                Write-Output "::error title=WPF startup regression::$detail"
              }
              throw "WPF startup/tab smoke test failed: $($app.ExitCode)"
            }
          }
      - run: dotnet publish Soultrap.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/publish
      - name: Package portable build and installer
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/Soultrap-0.3.1-win-x64.zip
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup 6 is required on this Windows runner.' }
          & $compiler /DPublishDir="$pwd\artifacts\publish" Soultrap.Installer/Soultrap.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
          Get-ChildItem artifacts -Filter *.zip | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content artifacts/SHA256SUMS.txt
          Get-ChildItem artifacts/installer -Filter *.exe | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Add-Content artifacts/SHA256SUMS.txt
      - name: Verify installer upgrade, relaunch and user-data preservation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Test-InstallerUpgrade.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Soultrap-Windows-x64
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
            artifacts/installer/*.exe
            artifacts/screenshots/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.427'
      - run: dotnet restore Soultrap.Tests --locked-mode
      - run: dotnet test Soultrap.Tests -c Release --no-restore
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, core-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Soultrap-Windows-x64
          path: release-files
      - name: Publish immutable stable update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.1 >/dev/null 2>&1; then
            echo 'Existing v0.3.1 release retained. New files remain in workflow artifacts.'
          else
            gh release create v0.3.1 $(find release-files -type f \( -name '*.exe' -o -name '*.zip' -o -name 'SHA256SUMS.txt' \)) --target "$GITHUB_SHA" --title 'Soultrap 0.3.1' --latest --notes-file CHANGELOG.md
          fi
  verify-public-feed:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Soultrap-Windows-x64
          path: downloaded
      - shell: pwsh
        run: |
          Expand-Archive downloaded/Soultrap-0.3.1-win-x64.zip feed-test
          $verified = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $app = Start-Process "$pwd/feed-test/Soultrap.exe" -ArgumentList '--update-feed-smoke-test' -PassThru
            if (!$app.WaitForExit(120000)) { $app.Kill(); throw 'Live update-feed check timed out.' }
            if ($app.ExitCode -eq 0) { $verified = $true; break }
            $report = Join-Path $env:TEMP 'Soultrap-smoke-errors.txt'
            if (Test-Path $report) { Get-Content $report }
            if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
          if (!$verified) { throw 'Published release API, installer download or integrity verification failed.' }
